  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

  <!-- ================= ADMIN MAIN CONTENT ================= -->
  <div class="admin-main">

    <!-- Topbar with Profile Badge (Strictly matching Reference Image 1) -->
    <header class="admin-topbar">
      <a class="admin-profile-badge" href="{{ url_for('home') }}" title="Return to Customer Site"
        style="text-decoration:none;">
        <div class="admin-avatar-circle">👨‍🍳</div>
        <span class="admin-profile-name">Admin ⌵</span>
      </a>
    </header>

    <!-- Main Content Area -->
    <main class="admin-content-area">
      <!-- Breadcrumb (Strictly matching Reference Image 1) -->
      <!-- <div class="admin-breadcrumb">
        <span>🏠</span>
        <span>/</span>
        <a href="{{ url_for('admin_dashboard') }}">Admin</a>
        <span>/</span>
        <span>{% block breadcrumb_current %}Dashboard{% endblock %}</span>
      </div> -->

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="toast toast-{{ category }}" style="position: static; margin-bottom: 24px; width: 100%;">
        <span>{% if category == 'success' %}✅{% else %}⚠️{% endif %}</span>
        <span>{{ message }}</span>
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      {% block admin_content %}{% endblock %}
    </main>
  </div>

  <!-- Toast Notification Mount -->
  <div class="toast-container" id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
